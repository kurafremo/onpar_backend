version: '3.8'

services:
  veritabani:
    image: postgres:17
    container_name: toros_postgres
    restart: always
    environment:
      POSTGRES_USER: onpar_user
      POSTGRES_PASSWORD: onpar_password
      POSTGRES_DB: onpar_db
    ports:
      - "5432:5432"
    volumes:
      - toros_postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: toros_fastapi
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - .:/app
    depends_on:
      - veritabani

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: toros_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@toros.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - veritabani

volumes:
  toros_postgres_data:
